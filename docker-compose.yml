version: '3.8'

services:
  # MySQL for Promotion Management Service
  mysql-management:
    image: mysql:8.0
    container_name: promotion_mysql_management
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: promotion_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_management_data:/var/lib/mysql
    networks:
      - promotion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # MySQL for Promotion Engine Service
  mysql-engine:
    image: mysql:8.0
    container_name: promotion_mysql_engine
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: promotion_engine
    ports:
      - "3307:3306"
    volumes:
      - mysql_engine_data:/var/lib/mysql
    networks:
      - promotion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis
  redis:
    image: redis:7-alpine
    container_name: promotion_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - promotion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: promotion_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - promotion-network
    restart: unless-stopped

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: promotion_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - promotion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Promotion Management Service
  promotion-management:
    build:
      context: .
      dockerfile: promotion-management-service/Dockerfile
    container_name: promotion_management_service
    depends_on:
      mysql-management:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-management:3306/promotion_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROMOTION_ENGINE_BASE_URL: http://promotion-engine:8081
      PROMOTION_ENGINE_API_KEY: dev-api-key-12345
    networks:
      - promotion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Promotion Engine Service
  promotion-engine:
    build:
      context: .
      dockerfile: promotion-engine-service/Dockerfile
    container_name: promotion_engine_service
    depends_on:
      mysql-engine:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-engine:3306/promotion_engine?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROMOTION_MANAGEMENT_BASE_URL: http://promotion-management:8080
      PROMOTION_MANAGEMENT_API_KEY: dev-api-key-67890
    networks:
      - promotion-network
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/engine/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  promotion-network:
    driver: bridge

volumes:
  mysql_management_data:
  mysql_engine_data:
  redis_data:
