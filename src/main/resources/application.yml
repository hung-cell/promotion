spring:
  application:
    name: Promotion

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/promotion_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.example.promotion: DEBUG
  file:
    name: logs/application.log

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# =================== App Config ===================
app:
  pagination:
    max-size: 100
  coupon:
    reservation:
      ttl-minutes: 15
  promotion:
    scheduler:
      expire-rate-ms: 60000
  coupon:
    scheduler:
      release-rate-ms: 60000
